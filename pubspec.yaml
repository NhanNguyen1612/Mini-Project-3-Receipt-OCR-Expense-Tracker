name: vku_expense_ocr
description: On-device receipt OCR and expense tracker for VKU Mini-Project 3.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  flutter_riverpod: ^2.5.1
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.10.1
  image_picker: ^1.0.7
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.2
  sqflite: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
